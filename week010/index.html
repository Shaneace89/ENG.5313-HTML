<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Technical Glossary Fetcher</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-8 font-sans min-h-screen flex justify-center items-center">

  <div class="max-w-md w-full bg-white p-6 rounded-2xl shadow-md border border-slate-200">
    <h1 class="text-2xl font-bold text-slate-900 mb-1">Live Glossary Fetcher</h1>
    <p class="text-slate-600 text-xs mb-6">Fetch technical terms directly from a remote API server.</p>

    <!-- Action Buttons -->
    <div class="space-y-2 mb-6">
      <button id="fetch-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-xl shadow transition-all text-xs flex items-center justify-center gap-2">
        🌐 Fetch Term: "API"
      </button>
      <button id="bad-fetch-btn" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2 px-4 rounded-xl transition-all text-xs">
        ⚠️ Test 404 Error Handling
      </button>
    </div>

    <!-- Error Alert Box (Hidden by default) -->
    <div id="error-box" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-red-700 text-xs flex items-start gap-2">
      ❌
      <span id="error-message">Something went wrong.</span>
    </div>

    <!-- Data Result Card -->
    <div id="result-card" class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs text-slate-500 italic text-center">
      Click a button above to fetch data from the server...
    </div>
  </div>

  <!-- Link to JavaScript file -->
  <script src="script.js"></script>
</body>
</html>
